[package]
name = "vox"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Tchanwangsa/vox"

[dependencies]
anyhow = "1.0.105"
core-foundation = "=0.10.0"
core-graphics = "0.24"
cpal = "0.18.2"
dirs = "7.0.0"
global-hotkey = "0.10.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
ureq = "2"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["rustls-tls-native-roots", "macos-system-configuration"] }
tokio = { version = "1", features = ["net", "rt", "time"] }
futures = "0.3"
security-framework = "3"
libc = "0.2.191"
raw-window-handle = "0.6"
objc = "0.2"
